name: Actualiser les modeles Chaturbate

on:
  schedule:
    # S'exécute automatiquement toutes les 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # Permet de lancer l'action manuellement depuis GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Exécuter le script de récupération
        run: node fetch-data.js

      - name: Commiter et pousser les modifications
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Mise à jour automatique des modèles" && git push)
