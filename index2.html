<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plateforme Live Chaturbate</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #f97316;
      --text: #f8fafc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 24px;
      background: var(--card-bg);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 20px;
      padding: 20px;
      flex: 1;
    }

    .player-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }

    .player-container iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #64748b;
    }

    .sidebar {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 120px);
    }

    .sidebar h2 {
      font-size: 1.1rem;
      margin-bottom: 12px;
    }

    .models-list {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .model-card {
      display: flex;
      gap: 12px;
      background: #0f172a;
      border-radius: 8px;
      padding: 8px;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .model-card:hover {
      transform: translateY(-2px);
      outline: 1px solid var(--accent);
    }

    .model-card img {
      width: 80px;
      height: 60px;
      object-fit: cover;
      border-radius: 4px;
    }

    .model-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .model-name {
      font-weight: bold;
      font-size: 0.9rem;
    }

    .model-stats {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    .error-box {
      color: #f87171;
      font-size: 0.85rem;
      padding: 10px;
      background: rgba(239, 68, 68, 0.1);
      border-radius: 6px;
      border: 1px solid #ef4444;
    }

    @media (max-width: 850px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { max-height: 400px; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Directs Chaturbate</h1>
    <button onclick="fetchOnlineModels()">Actualiser</button>
  </header>

  <div class="layout">
    <main>
      <div class="player-container" id="player">
        <div class="placeholder">Sélectionnez un modèle pour lancer la vidéo</div>
      </div>
    </main>

    <aside class="sidebar">
      <h2>Modèles en ligne</h2>
      <div class="models-list" id="modelsList">Chargement en cours...</div>
    </aside>
  </div>

  <script>
    const AFFILIATE_TAG = 'default'; // Remplacez par votre tag affilié si vous en avez un

    async function fetchOnlineModels() {
  const listContainer = document.getElementById('modelsList');
  listContainer.innerHTML = 'Chargement des modèles...';

  try {
    // Appelle votre propre serveur PHP au lieu d'un proxy externe
    const response = await fetch('api.php?track=' + AFFILIATE_TAG);
    
    if (!response.ok) {
      throw new Error('Erreur serveur (' + response.status + ')');
    }

    const data = await response.json();

    if (!Array.isArray(data) || data.length === 0) {
      listContainer.innerHTML = '<p>Aucun modèle en ligne pour le moment.</p>';
      return;
    }

    listContainer.innerHTML = '';

    data.forEach(model => {
      const card = document.createElement('div');
      card.className = 'model-card';
      card.onclick = () => selectModel(model.username);

      card.innerHTML = `
        <img src="${model.image_url}" alt="${model.username}" loading="lazy">
        <div class="model-info">
          <span class="model-name">${model.username}</span>
          <span class="model-stats">👁 ${model.num_users || 0} spectateurs</span>
        </div>
      `;
      listContainer.appendChild(card);
    });

  } catch (error) {
    console.error('Détail de l\'erreur :', error);
    listContainer.innerHTML = `
      <div class="error-box">
        <strong>Erreur de chargement :</strong><br>
        ${error.message}.<br><br>
        <em>Si vous testez en local sans serveur web (ex: protocole file://), hébergez les fichiers sur un serveur PHP (Apache/Nginx).</em>
      </div>
    `;
  }
}

      // URL API officielle
      const targetUrl = 'https://chaturbate.com/api/public/affiliates/onlinemodels/?wm=' + AFFILIATE_TAG + '&limit=20';
      
      // Passer par un proxy public pour contourner le blocage CORS du navigateur en local
      const proxyUrl = 'https://api.allorigins.win/get?url=' + encodeURIComponent(targetUrl);

      try {
        const response = await fetch(proxyUrl);
        if (!response.ok) throw new Error('Erreur HTTP: ' + response.status);
        
        const wrapperData = await response.json();
        
        // allorigins retourne les données sous forme de chaîne texte dans .contents
        const data = JSON.parse(wrapperData.contents);

        if (!Array.isArray(data) || data.length === 0) {
          listContainer.innerHTML = '<p>Aucun modèle trouvé ou réponse API vide.</p>';
          return;
        }

        listContainer.innerHTML = '';

        data.forEach(model => {
          const card = document.createElement('div');
          card.className = 'model-card';
          card.onclick = () => selectModel(model.username);

          card.innerHTML = `
            <img src="${model.image_url}" alt="${model.username}" loading="lazy">
            <div class="model-info">
              <span class="model-name">${model.username}</span>
              <span class="model-stats">👁 ${model.num_users || 0} spectateurs</span>
            </div>
          `;
          listContainer.appendChild(card);
        });

      } catch (error) {
        console.error('Détail de l\'erreur :', error);
        listContainer.innerHTML = `
          <div class="error-box">
            <strong>Erreur de chargement :</strong><br>
            ${error.message}.<br><br>
            <em>Vérifiez votre connexion ou retentez dans quelques secondes.</em>
          </div>
        `;
      }
    }

    function selectModel(username) {
      const player = document.getElementById('player');
      const embedUrl = `https://chaturbate.com/in/?tour=mL83&camp=default&track=${AFFILIATE_TAG}&room=${encodeURIComponent(username)}`;

      player.innerHTML = `
        <iframe 
          src="${embedUrl}" 
          allow="autoplay; fullscreen"
          allowfullscreen>
        </iframe>
      `;
    }

    // Lancer au chargement de la page
    window.addEventListener('DOMContentLoaded', fetchOnlineModels);
  </script>

</body>
</html>
