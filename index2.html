<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plateforme Live Chaturbate</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #f97316;
      --text: #f8fafc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 24px;
      background: var(--card-bg);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 20px;
      padding: 20px;
      flex: 1;
    }

    /* Player vidéo responsive */
    .player-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }

    .player-container iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #64748b;
    }

    /* Galerie des modèles en ligne */
    .sidebar {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 120px);
    }

    .sidebar h2 {
      font-size: 1.1rem;
      margin-bottom: 12px;
    }

    .models-list {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .model-card {
      display: flex;
      gap: 12px;
      background: #0f172a;
      border-radius: 8px;
      padding: 8px;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .model-card:hover {
      transform: translateY(-2px);
      outline: 1px solid var(--accent);
    }

    .model-card img {
      width: 80px;
      height: 60px;
      object-fit: cover;
      border-radius: 4px;
    }

    .model-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .model-name {
      font-weight: bold;
      font-size: 0.9rem;
    }

    .model-stats {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    @media (max-width: 850px) {
      .layout {
        grid-template-columns: 1fr;
      }
      .sidebar {
        max-height: 400px;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Directs Chaturbate</h1>
    <button id="refreshBtn" onclick="fetchOnlineModels()">Actualiser la liste</button>
  </header>

  <div class="layout">
    <main>
      <div class="player-container" id="player">
        <div class="placeholder">Sélectionnez un modèle dans la liste pour démarrer le live</div>
      </div>
    </main>

    <aside class="sidebar">
      <h2>En direct actuels</h2>
      <div class="models-list" id="modelsList">Chargement...</div>
    </aside>
  </div>

  <script>
    const AFFILIATE_TAG = 'linkdarkness123';

    // Récupération de la liste via l'API Webmaster
    async function fetchOnlineModels() {
      const listContainer = document.getElementById('modelsList');
      listContainer.innerHTML = 'Chargement...';

      try {
        // En production, faites cette requête depuis votre serveur back-end pour éviter les soucis CORS
        const response = await fetch('https://chaturbate.com/api/public/affiliates/onlinemodels/?wm=' + AFFILIATE_TAG + '&limit=20');
        const data = await response.json();

        listContainer.innerHTML = '';

        data.forEach(model => {
          const card = document.createElement('div');
          card.className = 'model-card';
          card.onclick = () => selectModel(model.username);

          card.innerHTML = `
            <img src="${model.image_url}" alt="${model.username}">
            <div class="model-info">
              <span class="model-name">${model.username}</span>
              <span class="model-stats">👁 ${model.num_users} spectateurs</span>
            </div>
          `;
          listContainer.appendChild(card);
        });

      } catch (error) {
        listContainer.innerHTML = '<p style="color:#ef4444;">Erreur de chargement de l\'API.</p>';
        console.error('Erreur API:', error);
      }
    }

    // Chargement du flux dans l'iframe lors du clic sur une carte
    function selectModel(username) {
      const player = document.getElementById('player');
      const embedUrl = `https://chaturbate.com/in/?tour=mL83&camp=default&track=${AFFILIATE_TAG}&room=${encodeURIComponent(username)}`;

      player.innerHTML = `
        <iframe 
          src="${embedUrl}" 
          allowfullscreen>
        </iframe>
      `;
    }

    // Charger les modèles au démarrage de la page
  async function fetchOnlineModels() {
  const listContainer = document.getElementById('modelsList');
  listContainer.innerHTML = 'Chargement...';

  try {
    // Appel vers votre fichier PHP local ou votre serveur Node.js
    const response = await fetch('js/script2.js'); 
    
    if (!response.ok) throw new Error("Erreur réseau");
    
    const data = await response.json();
    listContainer.innerHTML = '';

    data.forEach(model => {
      const card = document.createElement('div');
      card.className = 'model-card';
      card.onclick = () => selectModel(model.username);

      card.innerHTML = `
        <img src="${model.image_url}" alt="${model.username}">
        <div class="model-info">
          <span class="model-name">${model.username}</span>
          <span class="model-stats">👁 ${model.num_users} spectateurs</span>
        </div>
      `;
      listContainer.appendChild(card);
    });

  } catch (error) {
    listContainer.innerHTML = '<p style="color:#ef4444;">Erreur de chargement de l\'API.</p>';
    console.error('Erreur API:', error);
  }
}
);
  </script>

</body>
</html>
