<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lecteur Responsive Chaturbate</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #f97316;
      --text-color: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      width: 100%;
      max-width: 960px;
      margin-bottom: 24px;
      text-align: center;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 16px;
    }

    .search-container {
      display: flex;
      gap: 10px;
      justify-content: center;
      max-width: 500px;
      margin: 0 auto;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #334155;
      background-color: var(--card-bg);
      color: white;
      font-size: 1rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent-color);
    }

    button {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      background-color: var(--accent-color);
      color: white;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background-color: #ea580c;
    }

    main {
      width: 100%;
      max-width: 960px;
    }

    /* Le conteneur assure le respect du ratio 16:9 */
    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #64748b;
      font-size: 1.1rem;
    }

    /* Ajustements pour mobiles */
    @media (max-width: 640px) {
      body {
        padding: 12px;
      }
      .search-container {
        flex-direction: column;
      }
      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Directs Chaturbate</h1>
    <div class="search-container">
      <input type="text" id="modelInput" placeholder="Nom du modèle (ex: alexa)...">
      <button onclick="loadStream()">Charger</button>
    </div>
  </header>

  <main>
    <div class="video-wrapper" id="playerContainer">
      <div class="placeholder">Entrez un nom de modèle pour lancer le direct</div>
    </div>
  </main>

  <script>
    function loadStream() {
      const username = document.getElementById('modelInput').value.trim();
      const container = document.getElementById('playerContainer');

      if (!username) {
        alert('Veuillez saisir un pseudo valide.');
        return;
      }

      const affiliateTag = 'linkdarkness123';
      const embedUrl = `https://chaturbate.com/in/?tour=mL83&camp=default&track=${affiliateTag}&room=${encodeURIComponent(username)}`;

      container.innerHTML = `
        <iframe 
          src="${embedUrl}" 
          allowfullscreen>
        </iframe>
      `;
    }
  </script>

<iframe 
  src="https://chaturbate.com/in/?tour=mL83&camp=default&track=default&room=cb" 
  width="100%" 
  height="100%" 
  allow="autoplay; fullscreen"
  allowfullscreen>
</iframe>


</body>
</html>
