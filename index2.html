<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directs Chaturbate</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 24px;
      background: var(--card-bg);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }

    h1 { font-size: 1.4rem; }

    .main-container {
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .widget-box {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      overflow: hidden;
    }

    .widget-box h2 {
      font-size: 1.1rem;
      margin-bottom: 16px;
      color: #94a3b8;
    }

    /* Ratio et responsive du widget */
    .iframe-wrapper {
      width: 100%;
      height: 700px;
      border: none;
      border-radius: 8px;
    }

    @media (max-width: 768px) {
      .iframe-wrapper {
        height: 500px;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Directs Chaturbate</h1>
  </header>

  <div class="main-container">
    <div class="widget-box">
      <h2>Modèles en direct</h2>
      <!-- Widget officiel Chaturbate géré directement par leurs serveurs -->
      <iframe 
        class="iframe-wrapper" 
        src="https://chaturbate.com/affiliates/whitelabel/online_embed/?wm=default&limit=30" 
        allowfullscreen>
      </iframe>
    </div>
  </div>

</body>
</html>
